name: CogniApp
options:
  bundleIdPrefix: com.cogniapp
  deploymentTarget:
    iOS: "16.0"
settings:
  SWIFT_VERSION: "5.9"
  IPHONEOS_DEPLOYMENT_TARGET: "16.0"
targets:
  CogniApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: CogniApp
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.cogniapp.ios
      PRODUCT_NAME: CogniApp
      INFOPLIST_FILE: CogniApp/Resources/Info.plist
      GENERATE_INFOPLIST_FILE: false
      TARGETED_DEVICE_FAMILY: "1,2"
      SWIFT_VERSION: "5.9"
      CODE_SIGN_IDENTITY: "-"
      CODE_SIGNING_REQUIRED: "NO"
      CODE_SIGNING_ALLOWED: "YES"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      ENABLE_PREVIEWS: YES

  CogniAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CogniAppTests
    dependencies:
      - target: CogniApp
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.cogniapp.ios.tests
      PRODUCT_NAME: CogniAppTests
      CODE_SIGN_IDENTITY: "-"
      CODE_SIGNING_REQUIRED: "NO"
      CODE_SIGNING_ALLOWED: "YES"
