name: Build CogniApp iOS & iPadOS (.ipa)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'ios/**'
      - '.github/workflows/build-ios-ipa.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'ios/**'
  workflow_dispatch:

jobs:
  build-and-test:
    name: Test & Package CogniApp.ipa
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install xcpretty and XcodeGen
        run: |
          gem install xcpretty --no-document || true
          brew install xcodegen || true

      - name: Generate Xcode Project with XcodeGen
        run: |
          cd ios/CogniApp
          xcodegen generate

      - name: Run iOS Unit Tests
        continue-on-error: true
        run: |
          cd ios/CogniApp
          # Dynamically select an available iPhone or iPad simulator ID
          SIM_ID=$(xcrun simctl list devices available | grep -E "iPhone" | grep -o -E '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}' | head -n 1)
          if [ -z "$SIM_ID" ]; then
            SIM_ID=$(xcrun simctl list devices available | grep -o -E '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}' | head -n 1)
          fi
          echo "Selected Simulator ID: $SIM_ID"
          if [ -n "$SIM_ID" ]; then
            xcodebuild test \
              -project CogniApp.xcodeproj \
              -scheme CogniApp \
              -destination "platform=iOS Simulator,id=$SIM_ID" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              | (command -v xcpretty &> /dev/null && xcpretty || cat)
          else
            echo "⚠️ No simulator found; proceeding to build & package IPA."
          fi

      - name: Build & Package IPA
        run: |
          chmod +x ios/build_ipa.sh
          ./ios/build_ipa.sh

      - name: Upload CogniApp.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CogniApp-iOS-IPA
          path: ios/output/CogniApp.ipa
          if-no-files-found: error
          retention-days: 14
